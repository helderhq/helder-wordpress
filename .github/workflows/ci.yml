name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} (lint, PHPCS, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-progress
      - name: Syntaxcontrole
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer lint
      - run: composer test

  plugin-check:
    name: Plugin Check (WordPress.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip zoals hij wordt uitgebracht
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=helder/ HEAD | tar -x -C dist
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/helder
